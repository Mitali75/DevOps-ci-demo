<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mitali's Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
            transition: 0.3s;
        }

        .dark-mode {
            background-color: #121212;
            color: white;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        section {
            padding: 40px 20px;
            max-width: 1000px;
            margin: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        .project-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .dark-mode .project-card {
            background: #1e1e1e;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 15px 0;
        }

        button {
            padding: 8px 15px;
            border: none;
            background: #111;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        .toggle-btn {
            margin-top: 10px;
            background: #444;
        }
    </style>
</head>

<body>

<header>
    <h1>Your Name</h1>
    <p>Web Developer | Student</p>

    <nav>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <button class="toggle-btn" onclick="toggleMode()">Toggle Dark Mode</button>
</header>

<section id="about">
    <h2>About Me</h2>
    <p>Hello! I am passionate about creating websites and learning new technologies.</p>
</section>

<section id="projects">
    <h2>My Projects</h2>

    <div class="project-card">
        <h3>Project 1</h3>
        <p>Short description about your project.</p>
        <button onclick="viewProject()">View Project</button>
    </div>
</section>

<section id="contact">
    <h2>Contact Me</h2>

    <form onsubmit="return validateForm()">
        <input type="text" id="name" placeholder="Your Name">
        <input type="email" id="email" placeholder="Your Email">
        <textarea id="message" rows="4" placeholder="Your Message"></textarea>
        <button type="submit">Send</button>
    </form>
</section>

<footer>
    <p>© 2026 Your Name | All Rights Reserved</p>
</footer>

<script>
    function toggleMode() {
        document.body.classList.toggle("dark-mode");
    }

    function viewProject() {
        alert("Project details coming soon!");
    }

    function validateForm() {
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let message = document.getElementById("message").value;

        if (name === "" || email === "" || message === "") {
            alert("Please fill all fields!");
            return false;
        }

        alert("Message sent successfully!");
        return true;
    }
</script>

</body>
</html>
